syntax = "proto3";

option csharp_namespace = "AccessControlSystem.GrpcServices.Protos";

package GrpcProtos;

import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "Protos/common.proto";

service User{
	rpc CreateUser(CreateUserRequest) returns(UserDTO);
	rpc GetUser(GetRequest) returns(NullableUserDTO);
	rpc GetAllUsers(google.protobuf.Empty) returns(Users);
	rpc UpdateUser(UserDTO) returns(google.protobuf.Empty);
	rpc DeleteUser(DeleteRequest) returns(google.protobuf.Empty);
}

message Location{
	string state=1;
	string city=2;
	string address=3;
}
message Contact{
	string mail=1;
	string telephone=2;
}
message UserDTO{
	string id=1;
	string firstName=2;
	string lastName=3;
	string ci=4;
	Location location=5;
	string schoolLevel=6;
	Contact contact=7;
}
message Users{
	repeated UserDTO items=1;
}
message NullableUserDTO{
	oneof kind{
		google.protobuf.NullValue null=1;
		UserDTO user=2;
	}
}
message CreateUserRequest{
	string firstName=1;
	string lastName=2;
	string ci=3;
}